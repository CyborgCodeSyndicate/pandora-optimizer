name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        default: none
        type: choice
        options: [major, minor, patch, none]
      use_rc:
        description: Create an RC when bumping the version
        type: boolean
        default: false
      modules:
        description: Comma-separated Maven modules, empty for the complete reactor
        default: ''
permissions:
  contents: write
  packages: write
  actions: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      next_version: ${{ steps.deploy.outputs.next_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Deploy pipeline
        id: deploy
        uses: CyborgCodeSyndicate/utilities/pipelines/deploy@feature/pandora-inspector-and-version-updates
        with:
          java_version: '21'
          server_ids: github-pandora-optimizer
          deploy_server_id: github-pandora-optimizer
          version_bump: ${{ inputs.version_bump || 'none' }}
          use_rc: ${{ inputs.use_rc || false }}
          modules: ${{ inputs.modules }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_packages_user: ${{ secrets.GH_PACKAGES_USER }}
          github_packages_token: ${{ secrets.GH_PACKAGES_PAT }}

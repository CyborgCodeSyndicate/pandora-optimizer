name: PR Validator
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
  pull-requests: write
  checks: write
  security-events: write
  packages: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # The shared setup action installs JDK 21. Avoid the separate JRE metadata
      # download that failed with HTTP 403; Sonar analysis and its gate still run.
      SONAR_SCANNER_SKIP_JRE_PROVISIONING: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Validate SonarCloud authentication before the build
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "::error::Configure SONAR_TOKEN with analysis access to this SonarCloud project."
            exit 1
          fi
          if ! curl --fail --silent --show-error --retry 2 --connect-timeout 10 --max-time 30 \
            --user "${SONAR_TOKEN}:" https://sonarcloud.io/api/authentication/validate \
            | jq --exit-status '.valid == true' > /dev/null; then
            echo "::error::SonarCloud authentication could not be validated. Check service availability and the repository SONAR_TOKEN secret."
            exit 1
          fi
      - name: Run PR pipeline
        uses: CyborgCodeSyndicate/utilities/pipelines/pr-validator@feature/pandora-inspector-and-version-updates
        with:
          sonar_project_key: CyborgCodeSyndicate_pandora-optimizer
          sonar_org: cyborgcodesyndicate
          nvd_api_key: ${{ secrets.NVD_API_KEY }}
          sonar_token: ${{ secrets.SONAR_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          java_version: '21'
          server_ids: github-pandora-optimizer
          github_packages_user: ${{ secrets.GH_PACKAGES_USER || github.actor }}
          github_packages_token: ${{ secrets.GH_PACKAGES_PAT || github.token }}

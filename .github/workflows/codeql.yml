name: CodeQL
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  actions: read
  contents: read
  packages: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Maven Environment
        uses: CyborgCodeSyndicate/utilities/pipelines/shared/setup-maven@feature/pandora-inspector-and-version-updates
        with:
          java_version: '21'
          server_ids: github-pandora-optimizer
          github_packages_user: ${{ secrets.GH_PACKAGES_USER || github.actor }}
          github_packages_token: ${{ secrets.GH_PACKAGES_PAT || github.token }}
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Compile Java modules
        run: mvn -B -ntp -DskipTests package
      - name: Test CodeQL findings gate
        run: python3 -m unittest discover -s scripts/tests -v
      - uses: github/codeql-action/analyze@v4
        with:
          # This private repository has no Advanced Security code-scanning upload entitlement.
          # Keep the complete analysis and enforce its results using the SARIF report below.
          upload: never
          output: codeql-results
      - name: Require a clean CodeQL report
        run: python3 scripts/check_codeql_sarif.py codeql-results
      - name: Save CodeQL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: codeql-results/*.sarif
          if-no-files-found: error
